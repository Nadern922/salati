name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias salati \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "Salati@6320" \
            -keypass "Salati@6320" \
            -dname "CN=Nader, OU=Salati, O=Salati, L=Riyadh, S=Riyadh, C=SA"

      - name: Convert to base64
        run: base64 -w 0 release.keystore > release.keystore.base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            release.keystore.base64.txt
