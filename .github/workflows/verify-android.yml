name: Verify Android adhan
on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'stories/**'
      - 'styles/**'
      - 'native/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/verify-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test web integration
        run: node --test tests/*.test.cjs
      - name: Prepare Capacitor app
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          mkdir -p www
          cp index.html manifest.json privacy.html icon-192.png icon-512.png icon-maskable-512.png www/
          cp -R audio js stories styles www/
          npx cap init "صلاتي" "com.nadern922.salati" --web-dir=www
          npx cap add android
          python3 scripts/install-android-adhan.py
          npx cap sync
      - name: Compile Android app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: salati-background-adhan-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
